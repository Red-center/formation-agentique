name: tests
on:
  push:
    branches: ["participant/**"]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q
