name: exercise-check
on:
  push:
    branches: [master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make install
      - run: make test
      - run: make mutants
      - name: Surviving mutants exist (the exercise needs some)
        run: test "$(.venv/bin/mutmut results | grep -c survived)" -gt 0
